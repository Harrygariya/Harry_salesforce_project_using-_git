<template>
    <span class="mainContainer"></span>
    <lightning-button variant="base" label="Base" title="Looks like a link" onclick={handleClick} class="slds-m-left_x-small"></lightning-button>
    <template if:true={showmodal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse mybutton">
                    <lightning-icon  onclick={hidemodal} icon-name="action:close" alternative-text="Approved" title="Approved"></lightning-icon>
                </button>
                <div class="slds-modal__header">
                    <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Modal header</h1>
                </div>
                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                    <p>Sit nulla est ex deserunt exercitation anim occaecat. Nostrud ullamco deserunt aute id consequat
                        veniam incididunt duis in sint irure nisi. Mollit officia cillum Lorem ullamco minim nostrud
                        elit officia tempor esse quis. Cillum sunt ad dolore quis
                        aute consequat ipsum magna exercitation reprehenderit magna. Tempor cupidatat consequat elit
                        dolor adipisicing.</p>
                    <p>Dolor eiusmod sunt ex incididunt cillum quis nostrud velit duis sit officia. Lorem aliqua enim
                        laboris do dolor eiusmod officia. Mollit incididunt nisi consectetur esse laborum eiusmod
                        pariatur proident. Eiusmod et adipisicing culpa deserunt nostrud
                        ad veniam nulla aute est. Labore esse esse cupidatat amet velit id elit consequat minim ullamco
                        mollit enim excepteur ea.</p>
                </div>
                <div class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={hidemodal} aria-label="Cancel and close">Cancel</button>
                    <button class="slds-button slds-button_brand"  onclick={hidemodal}>Save</button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>

    </template>
    <lightning-card>
        <!-- <template if:true={shoemydiv} > -->
            <lightning-button variant="brand" data-id='myid' label={showmyTitle} title={showmyTitle} onclick={showme} class="slds-m-left_x-small"></lightning-button>
        <!-- </template> -->
        <!-- <template if:false={shoemydiv} >
            <lightning-button variant="brand" label='hide me' title="Show" onclick={showme} class="slds-m-left_x-small"></lightning-button>
        </template> -->
        
    </lightning-card>

   

    <div if:true={show}>
        <p>click hide button</p>
    </div>


    

</template>
